name: environment-samples

on:
  workflow_dispatch:
    inputs:
      sample:
        description: Environment-specific sample to verify
        required: true
        type: choice
        options:
          - docker
          - kubernetes

jobs:
  docker:
    if: ${{ inputs.sample == 'docker' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Check Docker prerequisite
        run: docker info
      - name: Install shared application
        run: ./mvnw --no-transfer-progress -f apps/todo-app/pom.xml install -DskipTests
      - name: Verify Docker sample
        run: ./mvnw --no-transfer-progress verify -pl connectors/docker -amd -Penvironment-samples -Dsystem.under.test.mode=embedded

  kubernetes:
    if: ${{ inputs.sample == 'kubernetes' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Check Kubernetes prerequisites
        run: |
          docker info
          kubectl cluster-info
      - name: Install shared application
        run: ./mvnw --no-transfer-progress -f apps/todo-app/pom.xml install -DskipTests
      - name: Verify Kubernetes sample
        run: ./mvnw --no-transfer-progress verify -pl connectors/kubernetes -amd -Penvironment-samples -Dsystem.under.test.mode=embedded
