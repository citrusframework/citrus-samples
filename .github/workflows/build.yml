name: build

on:
  pull_request:
    branches:
      - main
      - 3.x
      - 3.x-vintage
    paths-ignore:
      - '**.adoc'
      - '**.md'
      - 'KEYS'
      - 'LICENSE'
      - 'NOTICE'
  push:
    branches:
      - main
      - 3.x
      - 3.x-vintage
    paths-ignore:
      - '**.adoc'
      - '**.md'
      - 'KEYS'
      - 'LICENSE'
      - 'NOTICE'

jobs:
  gradle-sample:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build and test Gradle sample
        run: gradle clean build
        working-directory: build-tools/gradle

  samples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        group:
          - apps
          - getting-started
          - core
          - runtimes
          - endpoints
          - connectors
          - validation
          # `showcases` is verified only by the on-demand `integration` workflow.

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Install shared todo-app SUT
        if: matrix.group != 'apps'
        run: ./mvnw --no-transfer-progress -f apps/todo-app/pom.xml install -DskipTests
      - name: Verify ${{ matrix.group }} samples
        run: ./mvnw --no-transfer-progress -f ${{ matrix.group }}/pom.xml verify -Dsystem.under.test.mode=embedded
