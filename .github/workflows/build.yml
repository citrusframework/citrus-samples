name: build

on:
  pull_request:
    branches:
      - main
      - 3.x
      - 3.x-vintage
      - feature/127-restructure-sample-catalog
    paths-ignore:
      - '**.adoc'
      - '**.md'
      - 'KEYS'
      - 'LICENSE'
      - 'NOTICE'
  push:
    branches:
      - main
      - 3.x
      - 3.x-vintage
      - feature/127-restructure-sample-catalog
    paths-ignore:
      - '**.adoc'
      - '**.md'
      - 'KEYS'
      - 'LICENSE'
      - 'NOTICE'

jobs:
  gradle-sample:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build and test Gradle sample
        run: gradle test
        working-directory: sample-gradle

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build Todo App
        run: |
          ./mvnw --no-transfer-progress -pl :citrus-sample-todo install
      - name: Run Demos
        run: |
          ./mvnw --no-transfer-progress install -Dsystem.under.test.mode=embedded -f demo/sample-quarkus
          ./mvnw --no-transfer-progress install -Dsystem.under.test.mode=embedded -f demo/sample-bakery
          ./mvnw --no-transfer-progress install -Dsystem.under.test.mode=embedded -f demo/sample-bookstore
          ./mvnw --no-transfer-progress install -Dsystem.under.test.mode=embedded -f demo/sample-flightbooking
          ./mvnw --no-transfer-progress install -Dsystem.under.test.mode=embedded -f demo/sample-greeting
          ./mvnw --no-transfer-progress install -Dsystem.under.test.mode=embedded -f demo/sample-incident
      - name: Run Samples
        run: |
          ./mvnw --no-transfer-progress verify -Dsystem.under.test.mode=embedded -pl :citrus-sample-core-annotation-config
          ./mvnw --no-transfer-progress verify -Dsystem.under.test.mode=embedded -pl :citrus-sample-core-behaviors
          ./mvnw --no-transfer-progress verify -Dsystem.under.test.mode=embedded -pl :citrus-sample-binary
          ./mvnw --no-transfer-progress verify -Dsystem.under.test.mode=embedded -pl :citrus-sample-endpoints-camel
          ./mvnw --no-transfer-progress verify -Dsystem.under.test.mode=embedded -pl :citrus-sample-core-data-dictionaries
          ./mvnw --no-transfer-progress verify -Dsystem.under.test.mode=embedded -pl :citrus-sample-core-dynamic-endpoints
          ./mvnw --no-transfer-progress verify -Dsystem.under.test.mode=embedded -pl :citrus-sample-groovy
          ./mvnw --no-transfer-progress verify -Dsystem.under.test.mode=embedded -pl :citrus-sample-hamcrest
          ./mvnw --no-transfer-progress verify -Dsystem.under.test.mode=embedded -pl :citrus-sample-core-java-config
          ./mvnw --no-transfer-progress verify -Dsystem.under.test.mode=embedded -pl :citrus-sample-endpoints-jms
          ./mvnw --no-transfer-progress verify -Dsystem.under.test.mode=embedded -pl :citrus-sample-endpoints-kafka
          ./mvnw --no-transfer-progress verify -Dsystem.under.test.mode=embedded -pl :citrus-sample-endpoints-mail
          ./mvnw --no-transfer-progress verify -Dsystem.under.test.mode=embedded -pl :citrus-sample-core-message-store
          ./mvnw --no-transfer-progress verify -Dsystem.under.test.mode=embedded -pl :citrus-sample-core-reporting
          ./mvnw --no-transfer-progress verify -Dsystem.under.test.mode=embedded -pl :citrus-sample-endpoints-rmi
          ./mvnw --no-transfer-progress verify -Dsystem.under.test.mode=embedded -f runtimes
          ./mvnw --no-transfer-progress verify -Dsystem.under.test.mode=embedded -f connectors
          ./mvnw --no-transfer-progress verify -Dsystem.under.test.mode=embedded -f endpoints/ftp
          ./mvnw --no-transfer-progress verify -Dsystem.under.test.mode=embedded -f endpoints/http
          ./mvnw --no-transfer-progress verify -Dsystem.under.test.mode=embedded -f samples-json
          ./mvnw --no-transfer-progress verify -Dsystem.under.test.mode=embedded -f endpoints/ws
          ./mvnw --no-transfer-progress verify -Dsystem.under.test.mode=embedded -f endpoints/websocket
          ./mvnw --no-transfer-progress verify -Dsystem.under.test.mode=embedded -f samples-xml
