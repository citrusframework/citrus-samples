# On-demand full verification: the complete default Maven reactor from the
# repository root (all groups, including `showcases`) plus the standalone
# Gradle sample. The PR/push `build` workflow verifies every default group
# except `showcases`, which runs only here. Run it manually
# (Actions > integration > Run workflow). Docker, Kubernetes and Playwright
# samples stay in the separate `environment-samples` workflow.

name: integration

on:
  workflow_dispatch:

jobs:
  gradle-sample:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build and test Gradle sample
        run: gradle clean build
        working-directory: build-tools/gradle

  default-reactor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Verify complete default reactor
        run: ./mvnw --no-transfer-progress clean verify -Dsystem.under.test.mode=embedded
