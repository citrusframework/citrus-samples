name: GetBookDetails_Ok_1_IT
author: Christoph Deppisch
status: FINAL
description: Add book then request book details.
variables:
  - name: isbn
    value: "citrus:concat('978-', citrus:randomNumber(10))"
actions:
  - soap:
      client: bookStoreClient
      sendRequest:
        message:
          soapAction: addBook
          body:
            data: '<bkr:AddBookRequestMessage xmlns:bkr="http://www.consol.com/schemas/bookstore"><bkr:book><bkr:title>Maven: The Definitive Guide</bkr:title><bkr:author>Mike Loukides, Sonatype</bkr:author><bkr:isbn>${isbn}</bkr:isbn><bkr:year>2008</bkr:year></bkr:book></bkr:AddBookRequestMessage>'
  - soap:
      client: bookStoreClient
      receiveResponse:
        message:
          body:
            data: '<bkr:AddBookResponseMessage xmlns:bkr="http://www.consol.com/schemas/bookstore"><bkr:success>true</bkr:success></bkr:AddBookResponseMessage>'
  - soap:
      client: bookStoreClient
      sendRequest:
        message:
          soapAction: getBookDetails
          body:
            data: '<bkr:GetBookDetailsRequestMessage xmlns:bkr="http://www.consol.com/schemas/bookstore"><bkr:isbn>${isbn}</bkr:isbn></bkr:GetBookDetailsRequestMessage>'
  - soap:
      client: bookStoreClient
      receiveResponse:
        message:
          body:
            data: '<bkr:GetBookDetailsResponseMessage xmlns:bkr="http://www.consol.com/schemas/bookstore"><bkr:book><bkr:id>@ignore@</bkr:id><bkr:title>Maven: The Definitive Guide</bkr:title><bkr:author>Mike Loukides, Sonatype</bkr:author><bkr:isbn>${isbn}</bkr:isbn><bkr:year>2008</bkr:year><bkr:registration-date>@ignore@</bkr:registration-date></bkr:book></bkr:GetBookDetailsResponseMessage>'
        extract:
          body:
            - path: /bkr:GetBookDetailsResponseMessage/bkr:book/bkr:id
              variable: bookId
