name: GetBookAbstract_Ok_1_IT
author: Christoph Deppisch
status: FINAL
description: Add book then request book abstract returned as SOAP attachment.
variables:
  - name: isbn
    value: "citrus:concat('978-', citrus:randomNumber(10))"
actions:
  - soap:
      client: bookStoreClient
      sendRequest:
        message:
          soapAction: addBook
          body:
            data: '<bkr:AddBookRequestMessage xmlns:bkr="http://www.consol.com/schemas/bookstore"><bkr:book><bkr:title>Spring in Action</bkr:title><bkr:author>Craig Walls, Ryan Breidenbach</bkr:author><bkr:isbn>${isbn}</bkr:isbn><bkr:year>2007</bkr:year></bkr:book></bkr:AddBookRequestMessage>'
  - soap:
      client: bookStoreClient
      receiveResponse:
        message:
          body:
            data: '<bkr:AddBookResponseMessage xmlns:bkr="http://www.consol.com/schemas/bookstore"><bkr:success>true</bkr:success></bkr:AddBookResponseMessage>'
  - soap:
      client: bookStoreClient
      sendRequest:
        message:
          soapAction: getBookAbstract
          body:
            data: '<bkr:GetBookAbstractRequestMessage xmlns:bkr="http://www.consol.com/schemas/bookstore"><bkr:isbn>${isbn}</bkr:isbn></bkr:GetBookAbstractRequestMessage>'
  - soap:
      client: bookStoreClient
      receiveResponse:
        message:
          body:
            data: '<bkr:GetBookAbstractResponseMessage xmlns:bkr="http://www.consol.com/schemas/bookstore"><bkr:book><bkr:id>@ignore@</bkr:id><bkr:title>Spring in Action</bkr:title><bkr:author>Craig Walls, Ryan Breidenbach</bkr:author><bkr:isbn>${isbn}</bkr:isbn><bkr:year>2007</bkr:year><bkr:registration-date>@ignore@</bkr:registration-date></bkr:book></bkr:GetBookAbstractResponseMessage>'
          attachments:
            - contentId: book-abstract
              contentType: text/plain
              resource: "classpath:com/consol/citrus/samples/bookstore/book-abstract.txt"
        extract:
          body:
            - path: /bkr:GetBookAbstractResponseMessage/bkr:book/bkr:id
              variable: bookId
