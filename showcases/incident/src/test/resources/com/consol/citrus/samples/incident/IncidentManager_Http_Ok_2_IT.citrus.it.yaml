name: IncidentManager_Http_Ok_2_IT.yaml
author: Christoph Deppisch
status: FINAL
description: Calls IncidentManager via Http SOAP including field force interaction with FIXED outcome.
variables:
  - name: ticketId
    value: "citrus:randomUUID()"
  - name: customerId
    value: "citrus:randomNumber(6)"
actions:
  - echo:
      message: "Step 1: Send OpenIncident request message to IncidentManager via Http SOAP interface"
  - soap:
      client: incidentHttpClient
      sendRequest:
        fork: true
        message:
          soapAction: /IncidentManager/openIncident
          body:
            data: |
              <im:OpenIncident xmlns:im="http://www.citrusframework.org/schema/samples/IncidentManager/v1"><im:incident><im:ticketId>${ticketId}</im:ticketId><im:captured>citrus:currentDate('yyyy-MM-dd'T'00:00:00')</im:captured><im:state>NEW</im:state><im:component>SOFTWARE</im:component><im:description>Something went wrong with the software!</im:description></im:incident><im:customer><im:id>${customerId}</im:id><im:firstname>Christoph</im:firstname><im:lastname>Deppisch</im:lastname><im:address>Franziskanerstr. 38, 80995 München</im:address></im:customer></im:OpenIncident>
  - echo:
      message: "Step 2: Receive AnalyseIncident request message as NetworkService application via Http SOAP interface"
  - receive:
      endpoint: networkBackendHttpServer
      message:
        body:
          data: |
            <net:AnalyseIncident xmlns:net="http://www.citrusframework.org/schema/samples/NetworkService/v1"><net:incident><net:ticketId>${ticketId}</net:ticketId><net:description>Something went wrong with the software!</net:description></net:incident><net:network><net:lineId>@ignore@</net:lineId><net:type>SOFTWARE</net:type><net:connection>@ignore@</net:connection></net:network></net:AnalyseIncident>
      extract:
        body:
          - path: net:AnalyseIncident/net:network/net:lineId
            variable: lineId
          - path: net:AnalyseIncident/net:network/net:connection
            variable: connectionId
  - echo:
      message: "Step 3: Send AnalyseIncidentResponse message as result of the NetworkService call"
  - send:
      endpoint: networkBackendHttpServer
      message:
        headers:
          - name: Content-Type
            value: application/xml
        body:
          data: |
            <net:AnalyseIncidentResponse xmlns:net="http://www.citrusframework.org/schema/samples/NetworkService/v1"><net:ticketId>${ticketId}</net:ticketId><net:result><net:lineId>${lineId}</net:lineId><net:resultCode>CODE_citrus:randomNumber(4)</net:resultCode><net:solved>false</net:solved><net:bandwidth>12000</net:bandwidth><net:lineCheck>OK</net:lineCheck><net:connectionCheck>OK</net:connectionCheck><net:fieldForceRequired>true</net:fieldForceRequired></net:result></net:AnalyseIncidentResponse>
  - echo:
      message: "Step 4: Receive OpenIncident response message with analyse outcome from IncidentManager application"
  - soap:
      client: incidentHttpClient
      receiveResponse:
        message:
          body:
            data: |
              <im:OpenIncidentResponse xmlns:im="http://www.citrusframework.org/schema/samples/IncidentManager/v1"><im:ticketId>${ticketId}</im:ticketId><im:scheduled>@ignore@</im:scheduled></im:OpenIncidentResponse>
  - echo:
      message: "Step 5: Receive FieldForce Order request"
  - receive:
      endpoint: fieldForceOrderEndpoint
      message:
        body:
          data: |
            <ffs:OrderRequest xmlns:ffs="http://www.citrusframework.org/schema/samples/FieldForceService/v1"><ffs:incident><ffs:ticketId>${ticketId}</ffs:ticketId><ffs:description>@contains('Something went wrong')@</ffs:description></ffs:incident><ffs:customer><ffs:id>${customerId}</ffs:id><ffs:firstname>Christoph</ffs:firstname><ffs:lastname>Deppisch</ffs:lastname><ffs:address>Franziskanerstr. 38, 80995 München</ffs:address></ffs:customer><ffs:network><ffs:lineId>${lineId}</ffs:lineId></ffs:network></ffs:OrderRequest>
  - echo:
      message: "Step 6: Send FieldForce notifications"
  - echo:
      message: "Step 6.1: Send NEW field force notification"
  - send:
      endpoint: fieldForceNotificationEndpoint
      message:
        body:
          data: |
            <ffs:OrderNotification xmlns:ffs="http://www.citrusframework.org/schema/samples/FieldForceService/v1"><ffs:ticketId>${ticketId}</ffs:ticketId><ffs:customerId>${customerId}</ffs:customerId><ffs:state>NEW</ffs:state></ffs:OrderNotification>
  - sleep:
      milliseconds: "500"
  - echo:
      message: "Step 6.2: Handle ON_SITE field force notification"
  - send:
      endpoint: fieldForceNotificationEndpoint
      message:
        body:
          data: |
            <ffs:OrderNotification xmlns:ffs="http://www.citrusframework.org/schema/samples/FieldForceService/v1"><ffs:ticketId>${ticketId}</ffs:ticketId><ffs:customerId>${customerId}</ffs:customerId><ffs:state>ON_SITE</ffs:state></ffs:OrderNotification>
  - soap:
      server: smsGatewayServer
      receiveRequest:
        message:
          body:
            data: |
              <sms:SendSmsRequest xmlns:sms="http://www.citrusframework.org/schema/samples/SmsGateway/v1"><sms:communicationId>@variable('smsCommunicationId')@</sms:communicationId><sms:customerId>${customerId}</sms:customerId><sms:text>News from ticket '${ticketId}' - we started to fix your problem!</sms:text></sms:SendSmsRequest>
  - soap:
      server: smsGatewayServer
      sendResponse:
        message:
          body:
            data: |
              <sms:SendSmsResponse xmlns:sms="http://www.citrusframework.org/schema/samples/SmsGateway/v1"><sms:communicationId>${smsCommunicationId}</sms:communicationId><sms:success>true</sms:success></sms:SendSmsResponse>
  - sleep:
      milliseconds: "1500"
  - echo:
      message: "Step 6.3: Handle FIXED field force notification"
  - send:
      endpoint: fieldForceNotificationEndpoint
      message:
        body:
          data: |
            <ffs:OrderNotification xmlns:ffs="http://www.citrusframework.org/schema/samples/FieldForceService/v1"><ffs:ticketId>${ticketId}</ffs:ticketId><ffs:customerId>${customerId}</ffs:customerId><ffs:state>FIXED</ffs:state><ffs:reason>LOCATION_NOT_FOUND</ffs:reason></ffs:OrderNotification>
  - soap:
      server: smsGatewayServer
      receiveRequest:
        message:
          body:
            data: |
              <sms:SendSmsRequest xmlns:sms="http://www.citrusframework.org/schema/samples/SmsGateway/v1"><sms:communicationId>@variable('smsCommunicationId')@</sms:communicationId><sms:customerId>${customerId}</sms:customerId><sms:text>News from ticket '${ticketId}' - your problem is solved!</sms:text></sms:SendSmsRequest>
  - soap:
      server: smsGatewayServer
      sendResponse:
        message:
          body:
            data: |
              <sms:SendSmsResponse xmlns:sms="http://www.citrusframework.org/schema/samples/SmsGateway/v1"><sms:communicationId>${smsCommunicationId}</sms:communicationId><sms:success>true</sms:success></sms:SendSmsResponse>
  - sleep:
      milliseconds: "1000"
  - echo:
      message: "Step 6.4: Send CLOSED field force notification"
  - send:
      endpoint: fieldForceNotificationEndpoint
      message:
        body:
          data: |
            <ffs:OrderNotification xmlns:ffs="http://www.citrusframework.org/schema/samples/FieldForceService/v1"><ffs:ticketId>${ticketId}</ffs:ticketId><ffs:customerId>${customerId}</ffs:customerId><ffs:state>CLOSED</ffs:state></ffs:OrderNotification>
