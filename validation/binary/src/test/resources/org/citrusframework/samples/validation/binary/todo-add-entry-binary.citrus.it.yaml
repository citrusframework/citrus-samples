name: TodoListIT.testAddTodoEntryBinary.yaml
author: Christoph Deppisch
status: FINAL
description: TodoListIT.testAddTodoEntryBinary port
variables:
  - name: todoName
    value: citrus:concat('todo_', citrus:randomNumber(4))
  - name: todoDescription
    value: "Description: ${todoName}"
  - name: done
    value: "false"
actions:
  - send:
      endpoint: todoEndpoint
      message:
        type: BINARY
        headers:
          - name: _type
            value: org.citrusframework.samples.apps.todoapp.model.TodoEntry
        body:
          data: '{ "title": "${todoName}", "description": "${todoDescription}", "done": ${done}}'
  - receive:
      endpoint: todoEndpoint
      message:
        type: BINARY
        headers:
          - name: _type
            value: org.citrusframework.samples.apps.todoapp.model.TodoEntry
        body:
          data: '{ "title": "${todoName}", "description": "${todoDescription}", "done": ${done}}'
