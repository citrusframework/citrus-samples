name: TodoListIT.testAddTodoEntryBinaryBase64.yaml
author: Christoph Deppisch
status: FINAL
description: TodoListIT.testAddTodoEntryBinaryBase64 port
variables:
  - name: todoName
    value: citrus:concat('todo_', citrus:randomNumber(4))
  - name: todoDescription
    value: "Description: ${todoName}"
  - name: done
    value: "false"
actions:
  - send:
      endpoint: todoEndpoint
      message:
        type: BINARY
        headers:
          - name: _type
            value: com.consol.citrus.samples.todolist.model.TodoEntry
        body:
          data: '{ "title": "${todoName}", "description": "${todoDescription}", "done": ${done}}'
  - receive:
      endpoint: todoEndpoint
      message:
        type: BINARY_BASE64
        headers:
          - name: _type
            value: com.consol.citrus.samples.todolist.model.TodoEntry
        body:
          data: |
            citrus:encodeBase64('{ "title": "${todoName}", "description": "${todoDescription}", "done": ${done}}')
