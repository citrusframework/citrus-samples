name: "TodoListStaticTodoList.yaml"
author: "Citrus"
status: "FINAL"
actions:
  - http:
      client: "todoClient"
      sendRequest:
        GET:
          path: "/api/todolist"
          accept: "application/json"
  - http:
      client: "todoClient"
      receiveResponse:
        response:
          status: "200"
          type: "JSON"
          body:
            data: '[ { "id": "${todoId}", "title": "${todoName}", "description": "${todoDescription}", "done": false} ]'
