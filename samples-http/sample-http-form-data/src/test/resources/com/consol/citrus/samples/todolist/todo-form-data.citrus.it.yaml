name: "TodoListFormData"
author: "Citrus"
status: "FINAL"
variables:
  - name: "todoName"
    value: "citrus:concat('todo_', citrus:randomNumber(4))"
  - name: "todoDescription"
    value: "Description: ${todoName}"
actions:
  - http:
      client: "todoClient"
      sendRequest:
        fork: true
        POST:
          path: "/api/todo"
          contentType: "application/x-www-form-urlencoded"
          body:
            data: "title=${todoName}&description=${todoDescription}"
  - http:
      server: "todoListServer"
      receiveRequest:
        POST:
          path: "/api/todo"
          contentType: "application/x-www-form-urlencoded"
          type: "x-www-form-urlencoded"
          body:
            data: |
              <form-data xmlns="http://www.citrusframework.org/schema/http/message"><content-type>application/x-www-form-urlencoded</content-type><action>/api/todo</action><controls><control name="description"><value>${todoDescription}</value></control><control name="title"><value>${todoName}</value></control></controls></form-data>
  - http:
      server: "todoListServer"
      sendResponse:
        response:
          status: "200"
  - http:
      client: "todoClient"
      receiveResponse:
        response:
          status: "200"
