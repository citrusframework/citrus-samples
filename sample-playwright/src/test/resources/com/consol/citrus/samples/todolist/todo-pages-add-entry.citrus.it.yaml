name: "TodoPagesIT.testAddEntry"
author: "Citrus"
status: "FINAL"
description: "TodoPagesIT.testAddEntry port"
variables:
  - name: "todoName"
    value: "todo_citrus:randomNumber(4)"
  - name: "todoDescription"
    value: "Description: ${todoName}"
actions:
  - http:
      client: "todoClient"
      sendRequest:
        DELETE:
          path: "/api/todolist"
  - http:
      client: "todoClient"
      receiveResponse:
        response:
          status: "200"
  - playwright:
      browser: "browser"
      start: {}
  - playwright:
      browser: "browser"
      open:
        url: "http://localhost:8080/todolist"
  - playwright:
      browser: "browser"
      page-object:
        type: "com.consol.citrus.samples.todolist.page.TodoPage"
        validator: "com.consol.citrus.samples.todolist.page.TodoPage$Validator"
  - playwright:
      browser: "browser"
      page-object:
        type: "com.consol.citrus.samples.todolist.page.TodoPage"
        method: "submit"
        arguments:
          - "${todoName}"
          - "${todoDescription}"
  - playwright:
      browser: "browser"
      wait:
        condition: "visible"
        element:
          text: "${todoName}"
  - playwright:
      browser: "browser"
      verify:
        element:
          text: "${todoName}"
        check: "text"
        expected: "${todoName}"
