name: "TodoListIT.testAddTodoEntry"
author: "Christoph Deppisch"
status: "FINAL"
variables:
  - name: "todoId"
    value: "citrus:randomUUID()"
  - name: "todoName"
    value: "citrus:concat('todo_', citrus:randomNumber(4))"
  - name: "todoDescription"
    value: "Description: ${todoName}"
  - name: "done"
    value: "false"
actions:
  - send:
      endpoint: "jms:queue:jms.todo.inbound?connectionFactory=activeMqConnectionFactory"
      message:
        headers:
          - name: "_type"
            value: "com.consol.citrus.samples.todolist.model.TodoEntry"
        body:
          data: |
            { "id": "${todoId}", "title": "${todoName}", "description": "${todoDescription}", "done": ${done}}
  - http:
      client: "http://localhost:8080"
      sendRequest:
        GET:
          path: "/api/todo/${todoId}"
          accept: "application/json"
  - http:
      client: "http://localhost:8080"
      receiveResponse:
        response:
          status: "200"
          type: "JSON"
          body:
            data: |
              { "id": "${todoId}", "title": "${todoName}", "description": "${todoDescription}", "done": ${done}}
