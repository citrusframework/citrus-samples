name: "TodoPagesIT.testIndexPage.yaml"
author: "Christoph Deppisch"
status: "FINAL"
description: "TodoPagesIT.testIndexPage port"
actions:
  - selenium:
      browser: "browser"
      start: {}
  - selenium:
      navigate:
        page: "http://localhost:8080"
  - http:
      client: "todoClient"
      sendRequest:
        DELETE:
          path: "/api/todolist"
  - http:
      client: "todoClient"
      receiveResponse:
        response:
          status: "200"
  - selenium:
      page:
        type: "org.citrusframework.samples.connectors.selenium.page.WelcomePage"
        action: "validate"
  - selenium:
      page:
        type: "org.citrusframework.samples.connectors.selenium.page.WelcomePage"
        action: "startApp"
  - selenium:
      page:
        type: "org.citrusframework.samples.connectors.selenium.page.TodoPage"
        action: "validate"
