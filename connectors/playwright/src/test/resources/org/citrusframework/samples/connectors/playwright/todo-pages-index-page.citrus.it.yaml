name: "TodoPagesIT.testIndexPage.yaml"
author: "Citrus"
status: "FINAL"
description: "TodoPagesIT.testIndexPage port"
actions:
  - playwright:
      browser: "browser"
      start: {}
  - playwright:
      browser: "browser"
      open:
        url: "http://localhost:8080"
  - http:
      client: "todoClient"
      sendRequest:
        DELETE:
          path: "/api/todolist"
  - http:
      client: "todoClient"
      receiveResponse:
        response:
          status: "200"
  - playwright:
      browser: "browser"
      page-object:
        type: "org.citrusframework.samples.connectors.playwright.page.WelcomePage"
        validator: "org.citrusframework.samples.connectors.playwright.page.WelcomePage$Validator"
  - playwright:
      browser: "browser"
      page-object:
        type: "org.citrusframework.samples.connectors.playwright.page.WelcomePage"
        method: "startApp"
  - playwright:
      browser: "browser"
      page-object:
        type: "org.citrusframework.samples.connectors.playwright.page.TodoPage"
        validator: "org.citrusframework.samples.connectors.playwright.page.TodoPage$Validator"
