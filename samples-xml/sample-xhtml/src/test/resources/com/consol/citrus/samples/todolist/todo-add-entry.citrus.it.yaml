name: TodoAddTodoEntryIT
author: Christoph Deppisch
status: FINAL
variables:
  - name: todoName
    value: citrus:concat('todo_', citrus:randomNumber(4))
  - name: todoDescription
    value: 'Description: ${todoName}'
actions:
  - http:
      client: todoClient
      sendRequest:
        POST:
          path: /todolist
          contentType: application/x-www-form-urlencoded
          body:
            data: 'title=${todoName}&description=${todoDescription}'
  - http:
      client: todoClient
      receiveResponse:
        response:
          status: "200"
  - http:
      client: todoClient
      sendRequest:
        GET:
          path: /todolist
          accept: text/html
  - http:
      client: todoClient
      receiveResponse:
        response:
          status: "200"
          type: XHTML
        validate:
          - xpath:
              - expression: "(//xh:li[@class='list-group-item']/xh:span)[last()]"
                value: ${todoName}
