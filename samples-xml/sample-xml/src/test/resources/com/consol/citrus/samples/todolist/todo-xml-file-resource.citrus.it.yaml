name: TodoXmlValidationWithFileResourceIT.yaml
author: Christoph Deppisch
status: FINAL
variables:
  - name: todoId
    value: citrus:randomUUID()
  - name: todoName
    value: citrus:concat('todo_', citrus:randomNumber(4))
  - name: todoDescription
    value: 'Description: ${todoName}'
actions:
  - http:
      client: todoClient
      sendRequest:
        POST:
          path: /api/todolist
          contentType: application/xml
          body:
            resource:
              file: "classpath:templates/todo.xml"
  - http:
      client: todoClient
      receiveResponse:
        response:
          status: "200"
          type: PLAINTEXT
          body:
            data: ${todoId}
  - http:
      client: todoClient
      sendRequest:
        GET:
          path: /api/todo/${todoId}
          accept: application/xml
  - http:
      client: todoClient
      receiveResponse:
        response:
          status: "200"
          body:
            resource:
              file: "classpath:templates/todo.xml"
