name: TodoListIT.testSyncAddTodoEntry.yaml
author: Christoph Deppisch
status: FINAL
variables:
  - name: todoName
    value: citrus:concat('todo_', citrus:randomNumber(4))
  - name: todoDescription
    value: "Description: ${todoName}"
actions:
  - send:
      endpoint: todoJmsSyncEndpoint
      message:
        headers:
          - name: _type
            value: org.citrusframework.samples.apps.todoapp.model.TodoEntry
        body:
          data: '{ "title": "${todoName}", "description": "${todoDescription}" }'
  - receive:
      endpoint: todoJmsSyncEndpoint
      message:
        body:
          data: '"Message received"'
  - http:
      client: todoClient
      sendRequest:
        GET:
          path: /todolist
          accept: text/html
  - http:
      client: todoClient
      receiveResponse:
        response:
          status: 200
          type: XHTML
        validate:
          - xpath:
              - expression: "(//xh:li[@class='list-group-item']/xh:span)[last()]"
                value: "${todoName}"
